version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - APIFY_API_KEY=${APIFY_API_KEY}
      - DATABASE_URL=sqlite:///sma_app.db
    volumes:
      - .:/app
    command: python run.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

  db:
    image: sqlite:latest
    volumes:
      - ./db:/var/lib/sqlite

volumes:
  db:
